name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes the older run's answer worthless, so stop paying for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here publishes anything. Read-only is the entire requirement.
permissions:
  contents: read

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` and not `npm install`: it fails when package.json and the
      # lockfile disagree, which is one of the few classes of breakage a local
      # run will happily paper over and a Vercel build will not.
      - run: npm ci

      # `next build` typechecks too, but only what the route graph reaches and
      # only after a full compile. tsc fails in seconds and covers files that
      # nothing imports yet.
      - name: Typecheck
        run: npx tsc --noEmit

      # The numbers on the registry pages are real; only the ticker beside them
      # can lie, and nothing else notices when it does. This reads the deployed
      # ReputationRegistry and fails on any disagreement.
      - name: the settlement asset we name is the one the chain asserts
        run: node scripts/check-settlement-asset.mjs

      - name: Build
        run: npm run build
